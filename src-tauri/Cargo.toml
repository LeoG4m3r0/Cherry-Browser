[package]
name = "cherry-browser"
version = "0.4.12"
description = "Navegador Cherry Browser para Windows usando WebView2"
authors = ["Cherry Browser"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde_json = "1"
serde = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse"] }
webview2-com = "0.39.1"

[features]
custom-protocol = ["tauri/custom-protocol"]

