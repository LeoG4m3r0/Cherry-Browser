<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#191719"><title>Cherry Browser</title><link rel="icon" type="image/svg+xml" href="/assets/cherry-logo.svg"><link rel="stylesheet" href="/style.css"></head>
<body><div id="app"><header id="chrome"><div class="tabrow"><div id="tabs" class="tabs"><button id="newTab" class="new-tab" title="Nova aba (Ctrl+T)" aria-label="Nova aba">＋</button></div></div><nav class="toolbar"><button id="back" title="Voltar">‹</button><button id="forward" title="Avançar">›</button><button id="reload" title="Recarregar">⟳</button><button id="home" title="Início">⌂</button><div class="address-wrap"><span id="privacyMark">◉</span><input id="address" spellcheck="false" placeholder="Pesquise ou digite um endereço"><button id="bookmark" title="Adicionar favorito" aria-label="Adicionar favorito" aria-pressed="false">☆</button></div><button id="adBlockBtn" title="Bloqueador de anúncios: ativado" aria-label="Bloqueador de anúncios">⛨</button><button id="favorites" title="Favoritos" aria-label="Favoritos">☆</button><button id="downloads" title="Downloads" aria-label="Downloads">↓</button><button id="menuBtn" title="Menu">⋮</button></nav><div id="bookmarkBar" class="bookmark-bar"></div><div id="menuBackdrop" class="menu-backdrop hidden" aria-hidden="true"></div><div id="menu" class="menu hidden"><button data-panel="history">◷　Histórico</button><button data-panel="bookmarks">☆　Favoritos</button><button data-panel="downloads">↓　Downloads</button><button data-panel="settings">⚙　Configurações</button><button data-panel="personalize">✦　Personalizar</button><button data-panel="about">ⓘ　Sobre o Cherry</button><button id="privateTab">◉　Nova aba privada</button><button id="clearData">⌫　Limpar dados de navegação</button></div></header><main><section id="homeView" class="home-view"><div class="home-content"><div class="brand-mark"><img src="/assets/cherry-logo.svg" alt="Cereja Cherry Browser"></div><div class="brand">Cherry<span> Browser</span></div><p class="tagline">Sua navegação, do seu jeito. <span class="alpha-badge">ALPHA</span></p><div class="home-search"><span>⌕</span><input id="homeSearch" placeholder="Pesquisar na web ou digitar endereço"><button id="homeGo">→</button></div><div id="quickLinks" class="quick-links"></div><div class="home-footer">Navegue com leveza.</div></div></section><section id="panelHost" class="panel-host hidden"></section></main><div id="toast" class="toast"></div></div><script type="module" src="/main.js"></script></body></html>
